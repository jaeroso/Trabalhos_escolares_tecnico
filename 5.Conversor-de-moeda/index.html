<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor USD → BRL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Conversor USD → BRL</h1>

    <input type="number" id="dolar" placeholder="Digite o valor em dólar">

    <button onclick="converter()">
      Converter
    </button>

    <div id="resultado"></div>

    <div class="cotacao">
      Cotação fixa: 1 USD = R$ 5,50
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
